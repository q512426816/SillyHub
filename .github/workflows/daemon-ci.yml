name: daemon-ci

# HY-1（2026-08-20 审计）：sillyhub-daemon 有 144 个测试文件、承担宿主文件系统
# 操作与策略执行（安全敏感组件），此前 backend/frontend CI 齐全而 daemon 无任何
# CI。骨架复制 frontend-ci.yml，跑 typecheck + vitest（daemon 无独立 lint script）。

on:
  push:
    paths:
      - "sillyhub-daemon/**"
      - "backend/openapi.json"
      - ".github/workflows/daemon-ci.yml"
  pull_request:
    paths:
      - "sillyhub-daemon/**"
      - "backend/openapi.json"
      - ".github/workflows/daemon-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: sillyhub-daemon

jobs:
  typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: sillyhub-daemon/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # api-types 漂移守门（2026-10-09 风险审查后续）：daemon 生成物长期落后
      # backend/openapi.json（RBAC 72→58 死键残留实证）而无人发现——重生成后
      # git diff --exit-code，漂移即红。前置：后端 schema 改动须在同一变更内
      # 跑 daemon `pnpm gen:types` 提交生成物（对齐前端 pnpm gen:types 纪律）。
      - name: api-types drift check
        run: pnpm gen:types:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
