name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # 15 分钟撞顶致 Pytest 跑到 99% 被取消（2026-08-15 实测 15:13 超时，测试零失败）。
    # 全量 4000+ 用例 + 2 核 xdist + reruns 裕量放到 30 分钟。
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.4.18"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff (check)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://platform:platform@localhost:5432/platform_test
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: ci-secret-must-be-at-least-16-chars
          ENVIRONMENT: test
        # --reruns 2 --reruns-delay 1:CI 2 核低资源下 xdist + async fixture + in-memory SQLite
        # 偶发竞态 flaky(task/change/runtime reparse created=0 → StopIteration / 文件列表空)。
        # 本机 20 核全量 3931 passed 复现不了,loadscope 已挡大部分,残余 flaky 靠重试兜底
        # (与 -n 兼容)。失败用例重跑最多 2 次,间隔 1s。
        run: uv run pytest -n auto -q --cov=app --cov-fail-under=60 --reruns 2 --reruns-delay 1
