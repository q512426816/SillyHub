nt_stage；前置 sillyhub-platform-sync 建模块时漏登本次补）+ change 卡补 _project_current_stage/enrich_summaries/enrich_with_workspace_ids 投影符号 + 双向 used_by/depends_on（change↔platform_sync）。新建 modules/platform_sync.md。2026-08-14 增量更新（2026-08-14-change-center-conversation-driven）：change 卡补 ChangeSessionLink（change_session_links 表，change↔session 多对多，unique(change_id, session_id)）+ ChangeService.reparse(scope)（scoped 零 delete 红线 R-08 + created 自动绑定最近活跃会话 D-007）+ review 四方法 notify_session 服务身份注入（D-006@v2）；spec_workspace 卡补 SpecWorkspaceService.apply_ops（change_dirs 标注触发 scoped reparse，D-005）；daemon 卡补 SessionService.inject_session_as_service（服务身份注入，绕过用户归属校验）；mcp_gateway 卡 submit_stage_review 契约更新（不派发 + notify_session 注入 + notified_session/notify_error）。

