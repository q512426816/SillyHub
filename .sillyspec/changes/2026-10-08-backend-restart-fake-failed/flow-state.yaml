  成功标准：

  - 后端重启清理时，近期仍有 daemon 上报的运行轮不再被判死，等真终态

  - 被误标 SERVICE_RESTART_INTERRUPTED 的轮收到 daemon 迟到的成功结果后能回正为 completed

  - 补充对应用例覆盖上述两条路径
