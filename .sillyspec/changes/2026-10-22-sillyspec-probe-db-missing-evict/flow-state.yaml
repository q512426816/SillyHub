  - 非 db_missing 的非零退出保持既有 nonzero_exit 记账不变，且日志附带 stdout 首行便于诊断

  - 采集成功重置连败计数；淘汰后若根被重新 claim 注册则恢复采集

  - daemon 定向测试全绿，既有采集/降级语义零回归
