<!--
author: WhaleFall
created_at: 2026-08-12 09:50:00
description: 变更详情页阶段操作区改造 - 方案A原型（仅档案选择器，去掉手动 provider/model 框）
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案A：仅档案选择器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #f6f7f9; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
  .mock-frame { max-width: 760px; margin: 24px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; }
  .badge-tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:4px; background:#fde68a; color:#92400e; margin-left:8px; }
</style>
</head>
<body>
<div class="mock-frame space-y-4">

  <div class="text-xs text-gray-400 mb-1">变更：增加档案绑定 dispatch · 当前阶段：执行(execute)</div>

  <!-- 合并后的统一操作区 -->
  <section class="space-y-3 rounded-md border border-violet-500/40 bg-violet-50/40 px-4 py-3">
    <div class="flex items-center gap-2">
      <span class="text-sm font-semibold">阶段操作</span>
      <span class="text-xs text-gray-500">选档案 → 用档案配置派发；不选 → 按默认</span>
    </div>

    <!-- 档案选择器（常驻，单控件，无手动 provider/model 框） -->
    <div class="flex flex-wrap items-center gap-2">
      <span class="whitespace-nowrap text-xs text-gray-500">智能体档案</span>
      <select class="rounded border border-gray-300 bg-white px-2.5 py-1.5 text-xs focus:border-violet-500 focus:outline-none">
        <option>跟随工作区默认（不选档案）</option>
        <option>🤖 只写代码不繁琐验证（execute 专用）</option>
        <option>🤖 严谨核验档案</option>
        <option>🤖 GLM 通用档案</option>
      </select>
      <span class="text-[11px] text-gray-400">已选档案的 provider/model/凭证/技能 自动生效</span>
    </div>

    <!-- 两个按钮：推进 + 触发 -->
    <div class="flex items-center gap-2 pt-1">
      <button class="rounded bg-violet-600 hover:bg-violet-700 text-white text-xs px-3 py-1.5">推进到「验证」</button>
      <button class="rounded border border-gray-300 bg-white hover:bg-gray-50 text-xs px-3 py-1.5">🤖 触发智能体（重派当前）</button>
      <span class="text-[11px] text-gray-400 ml-auto">当前阶段已完成，待触发下一阶段</span>
    </div>
  </section>

  <!-- 团队开关（execute/verify 才出现） -->
  <section class="space-y-2">
    <label class="flex items-center gap-2.5 rounded-md border border-violet-500/40 bg-violet-50 px-3 py-2 text-xs">
      <span class="relative inline-flex h-5 w-9 items-center rounded-full bg-gray-300"><span class="inline-block h-4 w-4 translate-x-0.5 transform rounded-full bg-white shadow"></span></span>
      <span class="font-medium text-violet-900">用团队执行</span>
      <span class="text-gray-500">（多 worker 并行写，主 agent 指挥 + 合并）</span>
    </label>
    <!-- 勾开团队后：主agent档案 + 每 worker 各选档案 -->
    <div class="rounded-md border border-gray-200 px-3 py-2.5 space-y-2 text-xs" style="display:none">
      <div class="flex items-center gap-2">
        <span class="text-gray-500 w-20">主 agent 档案</span>
        <select class="rounded border border-gray-300 bg-white px-2 py-1 text-xs"><option>严谨架构师档案</option></select>
      </div>
      <div class="border-t pt-2 space-y-2">
        <div class="flex items-center gap-2"><span class="text-gray-500 w-20">worker 1 档案</span><select class="rounded border border-gray-300 bg-white px-2 py-1 text-xs"><option>后端实现档案</option></select></div>
        <div class="flex items-center gap-2"><span class="text-gray-500 w-20">worker 2 档案</span><select class="rounded border border-gray-300 bg-white px-2 py-1 text-xs"><option>前端实现档案</option></select></div>
        <button class="text-violet-600 text-xs">+ 添加 worker</button>
      </div>
    </div>
  </section>

  <div class="text-[11px] text-gray-400 border-t pt-2">
    <span class="badge-tag">方案A 特征</span>
    单一档案选择器，<b>无手动 provider/model 输入框</b>。provider/model 全由档案定，不选档案用工作区默认。UI 最简洁。
  </div>

</div>
</body>
</html>
