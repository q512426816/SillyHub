  P3-3——跨标签回放无版本概念，迟到的旧信封（内容基于已过时的本页状态）仍会覆盖较新的本地值，可造成已登出/已续票标签页的幽灵状态复活，与刚修掉的 11 小时 401 风暴同源子系统隐患；修法小而内聚值得现在收口。

