  知识搜索止血：内存扩容、同步时间戳与文案修正


  生产实证（2026-11-03 服务器诊断）：backend 容器 2500m 限额下嵌入/翻译 worker 仍周期性被 cgroup OOM kill（10 月 40 次、11-02 还有 2
