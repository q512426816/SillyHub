  成功标准：

  - deploy/docker-compose.yml backend mem_limit 为 3500m，注释记录依据

  - 差量同步成功后 knowledge_search_state.updated_at 刷新（新增测试断言，既有知识搜索测试全绿）

  - 搜索等待文案不再出现「首次搜索需建立索引」误导表述；model_ready=false 且 reason=index_not_built 时徽标提示索引未预建

  - 纯配置与前端文案不写测试（记不适用理由）
