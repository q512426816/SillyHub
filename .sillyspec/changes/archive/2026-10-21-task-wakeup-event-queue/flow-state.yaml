  唤醒通知排队呈现改为事件形式

  动机与背景：2026-10-21-task-wakeup-restore 恢复终态唤醒链后，忙轮滞留期的唤醒通知仍以「排队消息」形式呈现（message-queue-bar 用户消息 chip、占计数、与用户排队混列）——用户裁定应采用
