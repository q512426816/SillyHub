input: >-
  档案瘦身重定位为人格加技能清单并支持用户默认档案


  动机与背景：调研确认档案的引擎/模型/供应商/工具策略/MCP 字段在会话与群聊两条活跃链路均不消费（会话链路 D-013 刻意只注
  system_prompt+mcp/skill，群聊六要素独立配置引擎/模型/供应商/工作区；tool_policy 全链路死配置；model 两链路均死；MCP
  由平台资产库→工作区引用两层自动注入，档案级收紧语义裂缝）。本变更按用户拍板定稿：①表单瘦身为 名称/可见范围/系统提示词/技能勾选，删工作区上下文选择器/引擎/模型/供应商绑定/工具策略/MCP
  勾选，右栏预览简化，存量被删字段读侧忽略不清库；②档案卡片加「设为默认」（每用户一个，与供应商 is_default 同构），创建会话（/sessions、悬浮面板）与群聊 agent
  成员未显式选档案时注入用户默认档案的人格与技能，未设默认零注入零回归；③技能按档案挂载严格语义：选了档案（含默认档案注入）只挂档案勾选技能、空=不挂任何技能，未选档案且无默认维持全量现状——daemon 会话路径补技能裁剪执行点（现仅
  batch 任务路径有 prune），空数组协议语义从「不裁剪」翻转为「清空」并兼容旧 lease。


  成功标准：

  - 档案表单仅 名称/可见范围/系统提示词/技能勾选 四项，无工作区上下文/引擎/模型/供应商/工具策略/MCP 字段，右栏预览同步

  - 档案卡片有「设为默认」操作与默认标记，每用户至多一个默认档案

  - 创建会话与群聊成员未显式选档案时注入用户默认档案（人格+技能）；未设默认行为与现状逐字节一致

  - 选档案会话只挂档案技能子集，档案技能为空则不挂任何技能；未选档案且无默认时技能全量挂载（现状）

  - 既有档案数据不迁移不删列，被删字段读侧忽略；后端 llm_provider/claim 链零触碰
