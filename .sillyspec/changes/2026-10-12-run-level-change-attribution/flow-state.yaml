  动机：一个会话先后执行多个变更（sillyspec run / flow 两命令族）时，交互轮 AgentRun
  创建不带变更锚点（agent/service.py:1910、daemon/session/service/inject.py:608 change_id 恒 None），变更执行用量聚合（change/usage_service.py
