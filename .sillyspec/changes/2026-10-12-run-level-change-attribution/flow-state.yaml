  水位差分（2026-10-03-local-usage-segment-attribution）思想改为轮级归属。

  成功标准：

  - 会话轮消息中出现 sillyspec run/flow --change 命令后，平台记录会话级「当前变更上下文」（agent_sessions 新列），后续新开轮（inject）创建的 AgentRun.change_id
