  spec推送冲突自动自愈与日志修整


  动机：用户拍板「以本地为准」且要求部署即生效、零手工动作——现行 SpecPushConflict 升级人工裁决（删 manifest/resolve --keep-local）违反此诉求；另收口评审遗留两条 P3（event-loop
