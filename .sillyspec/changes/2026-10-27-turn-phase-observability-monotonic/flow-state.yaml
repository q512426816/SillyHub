  - 前端 applyTurnPhase 单调守卫：dispatched/delivered 不覆盖已是执行期阶段（skills_sync 至 inject_received）或 first_event 的
  currentPhase（回退写静默丢弃，正常推进与乱序前跳不受影响）

  - log 到达退位集合从 {dispatched, delivered} 扩展含 inject_received（AI 已输出的场合送达信号同样失去展示意义）

  - 既有相关测试全绿，新增用例覆盖上述三项行为

