input: >-
  智能体档案列表页重设计


  动机与背景：/agent-profiles 列表页观感陈旧（裸标题+散落筛选+卡片灰底块+链接按钮噪音）。用户经四轮反馈定稿原型
  F:\WorkNew\SillyHub\.sillyspec\explore\prototype-agent-profiles-page-restyle.html（页头品牌图标+统计胶囊；工具栏收拢一张卡；2
  列卡片墙；默认档案品牌光晕；系统预置紧凑整卡+提示文案；提示词引用式排版；技能芯片+N；操作降躁）。按原型落地实现。


  成功标准：

  - 页头对齐原型：品牌◆图标+标题+副标题，右侧统计胶囊（共 N 个档案·默认 M）+新建主按钮

  - 工具栏收拢成一张卡：搜索+工作区/可见范围/供应商三筛选+匹配计数同栏（文本仍回车触发、选择型即查，行为不变）

  - 卡片墙 2 列；用户默认档案品牌描边+光晕+★默认胶囊；系统预置紧凑整卡（虚线降调、提示词区显「未设置系统提示词，按引擎默认人设执行」、技能区显「按引擎默认能力执行」、只读，空白压至约 1/3）

  - 提示词改左竖线引用式排版（去灰底块）；技能芯片等宽字体超 4 项收 +N；无技能自定义卡显「无技能（不挂载）」占位

  - 卡脚操作降躁：常态灰色、悬停提亮（含设/取消默认、编辑、复制、删除），行为不变

  - 无硬编码 hex，颜色走 brand/语义 token，三主题可切换

  - 既有行为回归：搜索/筛选逻辑、点击卡片预览、删除/复制/默认切换路径、空态不变
