default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
# 2026-09-11 ql-20260911-006（坑 docs/sillyspec/pre-commit-autofix-swallows-commit.md）：
# 提交钩只检查不修复（--check / 去掉 --fix）——auto-fix 型 hook 在工作树有未暂存
# 改动时会触发 pre-commit stash↔auto-fix 冲突回滚（提交失败 + AM 态重试循环）；
# 改 check-only 后 hook 不再修改文件，冲突类从根上消失。格式化改为提交前手动：
#   uv run ruff format && uv run ruff check --fix（或修完再 add）
# 2026-09-23 ql（change-events-channel 执行会话反馈④）：hook 失败时直接打印对齐修复命令——
# 实证 hook 与项目同为 uv 环境解析（根/backend 两处 `uv run ruff --version` 均 0.15.14，
# uv.lock 同版本），被拦时先跑修复命令再 add，不要怀疑版本漂移而绕 hook。
# 2026-10-21-precommit-sandbox-entries：三条 pre-commit entry 去 `bash -c` 包装改直连
# （探针实锤：agent 沙箱把 python.exe 子树 IL 降为 Low，python→msys 嵌套必崩
# NtCreateDirectoryObject 0xC0000022、uv 默认缓存写 profile AppData 被驱动白名单拦，
# 详见 .sillyspec/changes/archive/2026-10-21-precommit-sandbox-entries/design.md）。
# uv 统一 --cache-dir 重定向进仓内 gitignored .tmp/uv-cache（Low 子树可写）。
# agent 会话内跑官方 runner 前设：export PRE_COMMIT_HOME="$PWD/.tmp/pre-commit-home"。
# 被拦时修复命令（ruff 报错已含文件与规则）：
#   cd backend && uv run ruff format <被拦文件>   /   cd backend && uv run ruff check --fix <被拦文件>
      - id: ruff-format
        name: ruff format --check
        entry: uv run --cache-dir .tmp/uv-cache ruff format --check
        language: system
        types: [python]
        pass_filenames: true
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check
        entry: uv run --cache-dir .tmp/uv-cache ruff check
        language: system
        types: [python]
        pass_filenames: true
        stages: [pre-commit]

# 2026-10-11-assertion-surface-guard：共享断言面同步闸门（check-only）——契约源
# （六面清单 + ⑦菜单注册表 ⑧协议 MSG）被触碰而配对钉子测试未同提交时 fail-closed。
# 清单权威：.sillyspec/knowledge/testing-gotchas.md「共享断言面」条目（与
# scripts/check-assertion-surfaces.py RULES 两处同步登记）。提醒性注释拦不住
#（本周 4 处漏跟实证），故上机制闸；单测 scripts/test_check_assertion_surfaces.py。
# 被拦时：本闸 check-only 不改文件；按脚本输出指引同步钉子测试后重新 add（勿绕过——仓库规则 10）。
      - id: assertion-surfaces
        name: check assertion surfaces
        entry: uv run --cache-dir .tmp/uv-cache python scripts/check-assertion-surfaces.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

# 2026-10-15-ci-recurrence-guard（fix-ci-red 灭火复盘）：CI 红灯三类根因
# （tsc 严格错误 vitest 不查、api-types 双侧漂移 push 后才见）全部缺本地
# 拦截面——pre-push 快检把 CI 同源四命令前移到推送时（约 1 分钟），fail-closed。
# 需一次性安装：backend/.venv/Scripts/python.exe -m pre_commit install
# --hook-type pre-push --config backend/.pre-commit-config.yaml
# 2026-10-21-precommit-sandbox-entries：以下两条 pre-push 保留 bash -c 包装不动——
# 推送发生在用户终端（Medium 树，bash/uv/pnpm 全可用）；agent 会话不推送，
# 不为其扩大改动面（agent 会话内手动触发 pre-push 仍会 msys 崩，属已知限制）。
      - id: ci-fast-gate
        name: pre-push CI 快检（typecheck×2 + api-types 漂移×2）
        entry: >-
          bash -c 'pnpm -C frontend typecheck && pnpm -C sillyhub-daemon typecheck && pnpm -C frontend gen:types:check && pnpm -C sillyhub-daemon gen:types:check || { echo "  ↩ 推送前快检未过（与 CI 同源）：按上方报错修复后重推；api-types 漂移 → pnpm -C frontend gen:types && pnpm -C sillyhub-daemon gen:types 后连同生成物提交"; exit 1; }' --
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

# 2026-10-15-ci-recurrence-guard 收编：原 .git/hooks/pre-push（2026-08-18 部署的
# 独立脚本，pre-commit install 时被改名 .legacy）迁入配置统一管理，语义零改动。
      - id: docs-gate
        name: sillyspec docs gate（文档失效引用只减不增棘轮）
        entry: >-
          bash -c 'sillyspec docs gate --against HEAD || { echo "  ↩ 文档失效 file:line 引用超基线；清偿后 sillyspec docs gate --init-baseline 下调"; exit 1; }' --
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
