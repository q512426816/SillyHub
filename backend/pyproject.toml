[project]
name = "multi-agent-platform-api"
version = "0.1.0"
description = "Multi-Agent Collaboration Platform — Backend API (FastAPI)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  # 知识搜索向量入库（2026-10-15-knowledge-search-pgvector）：PG vector 扩展的
  # SQLAlchemy 列类型与绑定互转（Vector(512)/with_variant）。
  "pgvector>=0.3",
  # zoneinfo 的 IANA 时区数据库：CLI naive 时间戳按 Asia/Shanghai 解释需要
  # （ql-20260822-006）。Windows venv 无系统 tz 库必须装；Linux 优先用系统
  # 数据，此包作兜底，无害。
  "tzdata>=2024.1",
  "redis>=5.0",
  "structlog>=24.4",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "pynacl>=1.5",
  "httpx>=0.27",
  # 2026-10-15-platform-vector-search：本地 embedding（fastembed 拉起 ONNX runtime，
  # 模型 bge-small-zh-v1.5 首用自动下载；缺席时向量端点 fail-soft 空结果不阻塞启动）。
  "fastembed>=0.4",
  "python-frontmatter>=1.1",
  # deploy_records 模块直接 import yaml 解析发布记录 frontmatter（此前为
  # python-frontmatter/alembic 的传递依赖，显式声明防漂移——
  # 2026-10-14-deploy-release-notes task-01）。
  "pyyaml>=6",
  "openpyxl>=3.1",
  # openpyxl 图像读写必需（ws._images 读 + add_image 写），D-008 / grill B-001 P0。
  "Pillow>=10",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  # 平台文件中心：S3 兼容对象存储异步客户端（spike-01 实测与现有异步栈无冲突）。
  "aiobotocore>=3.8,<4",
  # 对外 MCP 服务：官方 mcp Python SDK v1 线（FastMCP + http_app ASGI mount）。
  # spike-A（task-04）锁定 v1 线：v2.0.0(2026-07-28) 是 breaking 大改、移除 FastMCP 改用 MCPServer，
  # 与 design D-007「FastMCP mount」+ task-05/06 写法冲突，故锁 <2 取最新 1.29.0。
  # v1.x 仍持续收 critical bugfix/security patch（见 GitHub v1.x 分支）。
  "mcp>=1.29,<2",
  # 2026-10-19-thinking-zh-translate：思考内容离线翻译 en→zh 推理（子进程加载
  # ct2 格式 opus-mt int8 模型；懒加载，缺席时端点 fail-soft 原文透传）。
  "ctranslate2>=4.5,<5",
  # ct2 模型 tokenizer 分层回退的 sentencepiece 线（transformers 缺席时）+
  # HF repo 自动下载（尊重 HF_ENDPOINT；离线部署用 TRANSLATE_MODEL_DIR 免下载）。
  "sentencepiece>=0.2",
  "huggingface-hub>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  # 并行执行:20 核闲置时用 -n auto 把全量从 ~50min 压到分钟级(ql-20260723-010-32d6)。
  "pytest-xdist>=3.5",
  # CI(GitHub Actions 2 核)低资源下 xdist + async fixture + in-memory SQLite 仍偶发竞态
  # flaky(task/change/runtime reparse created=0 → StopIteration / 文件列表空)。本机 20 核
  # 全量 3931 passed 复现不了,loadscope(见 addopts)已挡大部分,残余 flaky 靠 reruns 重试
  # 兜底(与 -n 兼容)。CI 加 --reruns 2 --reruns-delay 1,本机不加(无需重试成本)。
  "pytest-rerunfailures>=14.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-passlib",
  "anyio>=4",
  "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# xdist 分发用 loadscope（按模块/类分组到 worker），不用默认 load（按测试 round-robin）。
# load 模式下跨文件测试混入同一 worker，触发间歇性 spec 文件扫描/reparse 得 0 的状态污染
# flaky（task/change/runtime/workspace 的 fixture 单跑过、全量 load 下偶发 reparse created=0
# → next() StopIteration / 文件列表空）。loadscope 把同模块测试整体绑到同一 worker，消除跨
# 模块状态交叉，全量 3868 passed 0 fail 稳定（2026-08-13 ql-002 定位）。仅 -n 激活时生效。
addopts = "-ra -o dist=loadscope"
# Discover both the top-level integration suite and module-local unit tests.
testpaths = ["tests", "app"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disable_error_code = ["attr-defined", "union-attr", "assignment", "arg-type", "valid-type", "operator", "call-overload", "call-arg"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docker-entrypoint.sh", "_tmp*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "BLE"]
# E501: line length is enforced by the formatter.
# N818: domain exceptions are named after the event (e.g. ``WorkspaceNotFound``)
#       not the suffix; the abstract ``AppError`` base still ends in "Error".
# RUF001/002/003: project uses Chinese text in strings/comments/docstrings.
# BLE001: catching bare Exception is common in async error handling.
# SIM105: contextlib.suppress hides traceback; explicit try/except preferred.
# SIM117: nested-with readability is fine.
# B008: FastAPI Query() in argument defaults is the standard pattern.
# RUF012: Pydantic models use mutable class attributes intentionally.
# RUF006: fire-and-forget tasks don't need a reference.
# RUF005: list concat style is a preference.
ignore = ["E501", "N818", "RUF001", "RUF002", "RUF003", "BLE001", "SIM105", "SIM117", "B008", "RUF012", "RUF006", "RUF005", "UP037"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "E402", "B017"]
"**/tests/*" = ["N802", "N803", "N806", "E402", "B017"]
"migrations/versions/*" = ["UP035"]  # alembic uses `typing.Sequence` in its template

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=4.6.0",
    "pymysql>=1.2.0",
    "ruff>=0.6",
]
