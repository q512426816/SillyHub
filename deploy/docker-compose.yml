# Full-stack compose: db + redis + backend + frontend.
# Used by ``make up`` and by the AC-01 acceptance test.
name: multi-agent-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      # D-006 弱口令 fail-fast：与 SECRET_KEY 同款 :?must set——未设置直接拒绝 compose 启动。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 绑 127.0.0.1：backend 走容器网络 postgres:5432，宿主端口仅本机调试用，
    # 不对局域网/公网暴露（task-14 端口收紧；三平台 compose 短语法均支持）。
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # D-006 弱口令 fail-fast：MINIO_ROOT_USER 保留默认（非密），密码强制设置。
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must set MINIO_ROOT_PASSWORD}
    # 9000 API / 9001 console 宿主侧均绑 127.0.0.1：backend 走容器网络 minio:9000，
    # 宿主端口仅供本机调试（native run / MinIO console），不对局域网/公网暴露。
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  # ql-20260826-011：Word 预览 LibreOffice→PDF 转换（OnlyOffice 不支持中文文档
  # 行网格 docGrid，公文空段撑页/目录位置与 Word 漂移；LibreOffice 完整支持）。
  # Excel/PPT 预览仍走 OnlyOffice；backend 侧 Gotenberg 不可用/转换失败自动回落。
  # 中文字体经 ./onlyoffice-fonts 只读挂载（宋体/仿宋/楷体/黑体/微软雅黑 + 方正
  # 内嵌子集；商用许可不入 Git——目录缺失时 LO 用替代字体，公文还原度下降）。
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    volumes:
      - ./onlyoffice-fonts:/usr/share/fonts/truetype/office-custom:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g

  backend:
    # 固定 tag：本地 build / 服务器 docker load / compose up 三者复用同一镜像名。
    # 部署改用 save/load（见 deploy/scripts/build-and-save.sh + load-and-up.sh），服务器不再现场构建。
    image: multi-agent-platform-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
      # 宿主机预构建的 daemon 分发物（install.sh + sillyhub-daemon.js）；
      # 部署前需 cd sillyhub-daemon && pnpm bundle 产出 build/bundle/。
      # 2026-07-07-daemon-skill-execution task-07：skills 上下文直接指向 .claude/skills/
      # 子目录（Dockerfile COPY --from=skills . /app/.claude/skills/）。指向仓库根会触发
      # compose additional_contexts 传输异常（只传 2.42kB，.claude/ 内容丢失），故直接指向子目录。
      additional_contexts:
        daemon: ../sillyhub-daemon
        skills: ../.claude/skills
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.241}
        # 空 → 取最新 sillyspec；填值 → pin。
        SILLYSPEC_VERSION: ${SILLYSPEC_VERSION:-}
        # Git SHA baked into the image; export COMMIT_SHA before `up --build`.
        COMMIT_SHA: ${COMMIT_SHA:-}
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # Mount host project directories so the scanner can read .sillyspec trees.
      # Adjust the left side to match your local path.
      - ${HOST_PROJECTS_DIR:-C:/Users/qinyi/IdeaProjects}:/host-projects
      - worktree-data:/data/sillyspec-workspaces
      # spec-workspaces: bind mount so the host daemon (Windows) and the backend
      # container share the same physical directory; otherwise the agent cannot
      # see spec documents written by the backend. Override host path via
      # SPEC_DATA_HOST_DIR in .env (see deploy/.env.example).
      - "${SPEC_DATA_HOST_DIR:-C:/data/spec-workspaces}:/data/spec-workspaces"
      - claude-data:/app/.claude
    environment:
      # Prefix that rewrites host-style paths into container mount paths.
      HOST_PATH_PREFIX: ${HOST_PATH_PREFIX:-C:/Users/qinyi/IdeaProjects}
      CONTAINER_PATH_PREFIX: /host-projects
      # D-006：密码走 :?must set，不保留 :-platform 默认兜底（否则 fail-fast 被 DB URL 旁路）。
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?must set SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:3001","http://127.0.0.1:3001"]}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      COMMIT_SHA: ${COMMIT_SHA:-}
      # 对象存储（平台文件中心）。Docker 内 minio 走服务名 minio:9000；
      # 凭证须与 minio 服务的 MINIO_ROOT_USER/MINIO_ROOT_PASSWORD 一致。
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # D-006 弱口令 fail-fast：去 minioadmin 默认，须在 .env 显式设置，
      # 且与 minio 服务的 MINIO_ROOT_USER/MINIO_ROOT_PASSWORD 保持一致。
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?must set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?must set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-platform-files}
      PLATFORM_BOOTSTRAP_ADMIN_EMAIL: ${PLATFORM_BOOTSTRAP_ADMIN_EMAIL:-}
      PLATFORM_BOOTSTRAP_ADMIN_PASSWORD: ${PLATFORM_BOOTSTRAP_ADMIN_PASSWORD:-}
      PLATFORM_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${PLATFORM_BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      SILLYSPEC_MASTER_KEY: ${SILLYSPEC_MASTER_KEY:?must set SILLYSPEC_MASTER_KEY}
      # task-04（security-audit-remediation）：daemon 可达的 hub 对外地址（master key
      # 收窄后，provider_config 下发的 litellm_base_url = 本值 + /api/daemon/llm-proxy）。
      # 容器内默认 localhost 只对 daemon 与 backend 同机时成立；daemon 在宿主机/异机时
      # 须在 .env 指向实际可达地址（如 http://<host>:8000）。
      HUB_PROXY_BASE_URL: ${HUB_PROXY_BASE_URL:-http://localhost:8000}
      WORKTREE_BASE_DIR: /data/sillyspec-workspaces
      SPEC_DATA_ROOT: /data/spec-workspaces
      HOME: /app
      NPM_CONFIG_CACHE: /tmp/.npm
      # Claude Code agent configuration is loaded from deploy/.env via env_file
      # so host-level ANTHROPIC_* variables do not override the Docker settings.
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # Run migrations before serving so a fresh stack always lands on head.
    command:
      - sh
      - -c
      # --ws-max-size 100MB：spec import 的 get_spec_bundle RPC 把 tar+base64 单帧回传，
      # 默认 16MiB 上限会被 >12MB 的 spec 目录撑爆（WS close 1009 致 import 必断）。
      # 治本在 daemon 端 gzip 压缩，这里是防御性兜底。
      - "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-max-size 104857600"
    mem_limit: 800m

  frontend:
    image: multi-agent-platform-frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_COMMIT_SHA: ${NEXT_PUBLIC_COMMIT_SHA:-}
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_COMMIT_SHA: ${NEXT_PUBLIC_COMMIT_SHA:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    mem_limit: 400m

  litellm-db:
    # Wave2 LiteLLM 转换网关的独立 store DB（change 2026-08-08-llm-provider-openai-format / FR-05）。
    # 独立于项目 postgres：LiteLLM 自带 alembic 会写自己的 alembic_version 表，与项目
    # alembic_version 同名冲突，故必须独立 DB 实例（spike-litellm-routing 定稿假设）。
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?must set LITELLM_DB_PASSWORD}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  litellm:
    # Wave2 Anthropic↔OpenAI 转换网关（FR-05 / NFR-03 / R-08）。平台代码不实现转换
    # （D-004/D-012 外包 LiteLLM）。admin API 动态注册：openai 供应商 set-default 时后端
    # POST /model/new 注册 model_name=usr-<uid>-<pid>（task-09），claim 时 provider_config 带
    # litellm_model_name（task-10），daemon 注 ANTHROPIC_BASE_URL=litellm → LiteLLM 按 model_name
    # 路由转 OpenAI 上游（task-11/12）。config 形态 / health 端点 / 镜像 tag 以
    # spike-litellm-routing 实测定稿（当前为 admin API 模式假设）。
    # ⚠️ pin 到 v1.95.0，不要用滚动 tag main-stable：1.96.0 起 anthropic /v1/messages 的
    # experimental responses adapter 不再认 model_info.mode=chat → 仍打上游 /responses → OpenAI
    # 兼容上游（GLM/通义/Kimi/opencode 无 /responses）404。v1.95.0 是 gap-A（change
    # 2026-08-08）mode=chat + 流式 /v1/messages 实测通过的版本（真 claude live 会话坐实）。
    # 升级前必须重跑 gap-A 实测矩阵确认新版本 anthropic adapter 认 mode=chat。
    image: ghcr.io/berriai/litellm:v1.95.0
    restart: always  # NFR-03/R-08：比 unless-stopped 更强，LiteLLM SPOF 宕自动拉起
    depends_on:
      litellm-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # master key 走 .env 不入库不进镜像（R-05）；同时作 openai 供应商经 LiteLLM 的
      # auth_token（LiteLLM /v1/messages 接受 master key 鉴权）。
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?must set LITELLM_MASTER_KEY}
      STORE_MODEL_IN_DB: "True"  # admin API 动态注册需 DB 持久化（spike 定稿假设）
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?must set LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      # 不设 PYTHONUNBUFFERED 时 litellm 崩溃日志被 Python stdout 缓冲吞掉（docker logs 全空），
      # 极难定位。强制 unbuffered，崩溃 traceback 立即 flush，OOM/迁移失败一眼可见。
      PYTHONUNBUFFERED: "1"
    volumes:
      # admin API 模式起步空 model_list，运行时 set-default 动态注册（spike 定稿假设）。
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      # health 端点以 spike 实测为准（LiteLLM 默认 /health/liveness）。
      # litellm 镜像无 curl（端到端联调发现 healthcheck 永远 unhealthy，违 NFR-03），改 python urllib
      # （litellm 是 python 应用，python 在 PATH）。task-08 返工 2026-08-09。
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveness')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      # 首启对全新 litellm-db 跑 prisma migrate deploy（142 步迁移 + engine 下载）耗时较长，
      # 给 180s 启动宽限，避免迁移期被误判 unhealthy（迁移完一次后重启很快）。
      start_period: 180s
    # 不写 ports：仅 backend 同 default network 可达 litellm:4000（R-05 网络隔离——
    # LiteLLM 对公网 + master key 泄漏 = 所有 openai 上游 key 暴露）。
    # backend 不 depends_on litellm：anthropic 链路不经 LiteLLM，LiteLLM 宕不能拖垮
    # backend 启动（NFR-03 故障域隔离，仅 openai 链路受影响）。
    # 512m 不够：首启 prisma migrate deploy（下载 query/migration engine + 跑 142 步迁移）瞬时内存尖峰
    # 超 512m → OOM kill → restart:always 循环 → 迁移永远跑不完、4000 永不监听（docker events 见 oom 事件）。
    # 提到 1g 让一次性迁移跑完；稳态内存 ~300M，limit 只是允许尖峰。
    mem_limit: 1g

volumes:
  pgdata:
  redisdata:
  litellm-db-data:
  worktree-data:
  claude-data:
  minio-data:
